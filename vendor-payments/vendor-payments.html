<script>

// =============================================================
// MOCK BACKEND (dummy data, no server needed)
// Create / update / delete work in memory; data resets on refresh.
// =============================================================
var VP_API = "/mock/vendor-payments/v1";
var VENDOR_API = "/mock/vendors";

var MOCK_VENDORS = [
  { vendorStrId: "VND-001", vendorName: "Ramesh Patil", companyName: "Patil Traders Pvt Ltd" },
  { vendorStrId: "VND-002", vendorName: "Anita Sharma", companyName: "Sharma Steel Works" },
  { vendorStrId: "VND-003", vendorName: "Vikram Joshi", companyName: "Joshi Office Supplies" },
  { vendorStrId: "VND-004", vendorName: "Neha Kulkarni", companyName: "Kulkarni Print House" }
];
var MOCK_BILLS = [
  { pbStrId: "PB-1001", vendorId: "VND-001", total: 47200 },
  { pbStrId: "PB-1002", vendorId: "VND-001", total: 35400 },
  { pbStrId: "PB-1003", vendorId: "VND-002", total: 82600 },
  { pbStrId: "PB-1004", vendorId: "VND-002", total: 29500 },
  { pbStrId: "PB-1005", vendorId: "VND-003", total: 64900 },
  { pbStrId: "PB-1006", vendorId: "VND-004", total: 18880 }
];
var MOCK_PAYMENTS = [
  { vpStrId: "VP-1001", vendorId: "VND-001", date: "2026-10-05", amount: 30000, mode: "NEFT", reference: "UTR1001", bankAccountName: "HDFC Bank — Current", status: "paid", notes: "Part payment", allocations: [{ billStrId: "PB-1001", amount: 30000 }] },
  { vpStrId: "VP-1002", vendorId: "VND-002", date: "2026-10-08", amount: 50000, mode: "UPI", reference: "UPI-88231", bankAccountName: "ICICI Bank — Current", status: "cleared", notes: "", allocations: [{ billStrId: "PB-1003", amount: 50000 }] },
  { vpStrId: "VP-1003", vendorId: "VND-003", date: "2026-10-11", amount: 20000, mode: "Cheque", reference: "CHQ-004512", bankAccountName: "HDFC Bank — Current", status: "pending", notes: "Cheque not yet cleared", allocations: [{ billStrId: "PB-1005", amount: 20000 }] },
  { vpStrId: "VP-1004", vendorId: "VND-001", date: "2026-09-28", amount: 15000, mode: "Cash", reference: "", bankAccountName: "Petty Cash", status: "paid", notes: "", allocations: [{ billStrId: "PB-1002", amount: 15000 }] },
  { vpStrId: "VP-1005", vendorId: "VND-004", date: "2026-09-20", amount: 8000, mode: "RTGS", reference: "RTGS-7731", bankAccountName: "HDFC Bank — Current", status: "bounced", notes: "Bounced - wrong account", allocations: [{ billStrId: "PB-1006", amount: 8000 }] }
];
var mockSeq = 1006;

function mockClone(x) { return JSON.parse(JSON.stringify(x)); }
function mockFail(msg) { throw new Error(msg); }
function mockVendor(id) { return MOCK_VENDORS.find(function (v) { return v.vendorStrId === id; }); }
function mockCounts(p) { return p.status === "paid" || p.status === "cleared"; }

function mockBalance(bill, excludeVp) {
  var used = 0;
  MOCK_PAYMENTS.forEach(function (p) {
    if (p.vpStrId === excludeVp || !mockCounts(p)) return;
    p.allocations.forEach(function (a) { if (a.billStrId === bill.pbStrId) used += a.amount; });
  });
  return Math.round((bill.total - used) * 100) / 100;
}

function mockView(p) {
  var v = mockVendor(p.vendorId), out = mockClone(p);
  out.vpNumber = p.vpStrId;
  out.vendorName = v ? v.vendorName : "";
  out.allocations.forEach(function (a) { a.billNumber = a.billStrId; });
  return out;
}

function mockValidate(b, editingId) {
  if (!mockVendor(b.vendorId)) mockFail("Vendor not found.");
  if (!b.date) mockFail("Date is required.");
  if (!(b.amount > 0)) mockFail("Amount must be greater than 0.");
  if (PAY_MODES.indexOf(b.mode) === -1) mockFail("Invalid payment mode.");
  b.status = b.status || "paid";
  var seen = {}, total = 0;
  (b.allocations || []).forEach(function (a) {
    var bill = MOCK_BILLS.find(function (x) { return x.pbStrId === a.billStrId; });
    if (!bill) mockFail("Bill " + a.billStrId + " not found.");
    if (bill.vendorId !== b.vendorId) mockFail(a.billStrId + " does not belong to this vendor.");
    if (seen[a.billStrId]) mockFail("The same bill is allocated more than once.");
    seen[a.billStrId] = true;
    if (mockCounts(b) && a.amount > mockBalance(bill, editingId) + 0.005) mockFail("Allocation for " + a.billStrId + " exceeds its balance.");
    total += a.amount;
  });
  if (total > b.amount + 0.005) mockFail("Total allocated exceeds the payment amount.");
}

// Same signature as the real apiRequest, so the rest of the page is unchanged.
async function apiRequest(method, url, body) {
  await new Promise(function (r) { setTimeout(r, 250); });
  var parts = url.split("?"), path = parts[0], qs = new URLSearchParams(parts[1] || ""), m;

  if (path === VENDOR_API + "/vendor-list") return mockClone(MOCK_VENDORS);
  if (path.indexOf(VP_API) !== 0) mockFail("Unknown mock endpoint: " + path);
  var ep = path.slice(VP_API.length);

  if (method === "GET" && ep === "/get-all-vendor-payments") {
    var mode = (qs.get("mode") || "").toLowerCase(), vid = qs.get("vendorId") || "", q = (qs.get("search") || "").toLowerCase();
    return MOCK_PAYMENTS.map(mockView).filter(function (p) {
      return (!mode || p.mode.toLowerCase() === mode) && (!vid || p.vendorId === vid) &&
        (!q || [p.vpNumber, p.vendorName, p.reference].join(" ").toLowerCase().indexOf(q) !== -1);
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }
  if (method === "GET" && ep === "/stats") {
    var ym = todayStr().slice(0, 7), s = { totalPayments: MOCK_PAYMENTS.length, totalPaid: 0, thisMonth: 0, pendingAmount: 0 };
    MOCK_PAYMENTS.forEach(function (p) {
      if (mockCounts(p)) { s.totalPaid += p.amount; if (p.date.slice(0, 7) === ym) s.thisMonth += p.amount; }
      if (p.status === "pending") s.pendingAmount += p.amount;
    });
    return s;
  }
  if (method === "GET" && (m = ep.match(/^\/vendor-bills\/(.+)$/))) {
    var vendorId = decodeURIComponent(m[1]), excl = qs.get("excludeVpStrId") || "";
    return MOCK_BILLS.filter(function (b) { return b.vendorId === vendorId; })
      .map(function (b) { return { pbStrId: b.pbStrId, pbNumber: b.pbStrId, balance: mockBalance(b, excl) }; })
      .filter(function (b) { return b.balance > 0; });
  }
  if (method === "POST" && ep === "/create-vendor-payment") {
    mockValidate(body, "");
    var np = mockClone(body); np.vpStrId = "VP-" + (mockSeq++);
    MOCK_PAYMENTS.push(np);
    return mockView(np);
  }
  if (method === "PUT" && (m = ep.match(/^\/update-vendor-payment\/(.+)$/))) {
    var id = decodeURIComponent(m[1]), idx = MOCK_PAYMENTS.findIndex(function (p) { return p.vpStrId === id; });
    if (idx === -1) mockFail("Vendor payment not found.");
    mockValidate(body, id);
    var up = mockClone(body); up.vpStrId = id;
    MOCK_PAYMENTS[idx] = up;
    return mockView(up);
  }
  if (method === "DELETE" && (m = ep.match(/^\/delete-vendor-payment\/(.+)$/))) {
    var did = decodeURIComponent(m[1]), di = MOCK_PAYMENTS.findIndex(function (p) { return p.vpStrId === did; });
    if (di === -1) mockFail("Vendor payment not found.");
    MOCK_PAYMENTS.splice(di, 1);
    return null;
  }
  mockFail("Unsupported mock request: " + method + " " + ep);
}

// =============================================================
// ICONS + HELPERS
// =============================================================
function iconPlus() { return '<i class="fa-solid fa-plus"></i>'; }
function iconEdit() { return '<i class="fa-solid fa-pen"></i>'; }
function iconTrash() { return '<i class="fa-solid fa-trash"></i>'; }
function iconEye() { return '<i class="fa-solid fa-eye"></i>'; }
function iconX() { return '<i class="fa-solid fa-xmark"></i>'; }
function iconSearch() { return '<i class="fa-solid fa-magnifying-glass"></i>'; }
function iconSave() { return '<i class="fa-solid fa-floppy-disk"></i>'; }
function iconPrint() { return '<i class="fa-solid fa-print"></i>'; }
function iconMoney() { return '<i class="fa-solid fa-money-check-dollar"></i>'; }

function E(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function money(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function normDate(d) {
  if (Array.isArray(d)) return d[0] + '-' + String(d[1]).padStart(2, '0') + '-' + String(d[2]).padStart(2, '0');
  return d || '';
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function showToast(message, kind) {
  kind = kind || 'success';
  var colors = { success: 'bg-green-600', info: 'bg-primary', warning: 'bg-amber-600', error: 'bg-red-600' };
  var el = document.createElement('div');
  el.className = 'toast ' + colors[kind] + ' text-white text-sm font-semibold px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 max-w-xs';
  el.innerHTML = '<span>' + E(message) + '</span>';
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(function () { el.remove(); }, 300);
  }, kind === 'error' ? 4500 : 2600);
}

function openModal(innerHtml, opts) {
  opts = opts || {};
  document.getElementById('modalRoot').innerHTML =
    '<div class="fixed inset-0 z-[100] flex items-center justify-center p-4" id="modalOverlay">' +
    '<div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]" id="modalBackdrop"></div>' +
    '<div class="relative bg-white rounded-2xl shadow-2xl w-full ' + (opts.width || 'max-w-3xl') + ' max-h-[92vh] overflow-hidden animate-modal">' + innerHtml + '</div></div>';
  document.getElementById('modalBackdrop').addEventListener('click', closeModal);
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
  formBills = []; editingVpId = '';
}
function modalHeader(title, subtitle) {
  return '<div class="flex items-start justify-between px-6 py-5 border-b border-gray-100 sticky top-0 bg-white z-10"><div>' +
    '<h3 class="text-lg font-bold text-gray-900">' + E(title) + '</h3>' +
    (subtitle ? '<p class="text-xs text-gray-500 mt-0.5">' + E(subtitle) + '</p>' : '') + '</div>' +
    '<button onclick="closeModal()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-700 transition">' + iconX() + '</button></div>';
}
function modalFooter(saveLabel, onSaveAttr, extraBtns, danger) {
  var cls = danger ? 'bg-red-600 hover:bg-red-700' : 'bg-primary hover:bg-primary-dark';
  return '<div class="flex items-center justify-between gap-2 px-6 py-2 border-t border-gray-100 bg-gray-50 rounded-b-2xl sticky bottom-0"><div>' + (extraBtns || '') + '</div><div class="flex gap-2">' +
    '<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 border border-gray-200 hover:bg-white transition">Cancel</button>' +
    '<button ' + onSaveAttr + ' class="px-4 py-2 rounded-lg text-sm font-semibold text-white ' + cls + ' transition shadow-sm flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed">' +
    (danger ? iconTrash() : iconSave()) + ' ' + saveLabel + '</button></div></div>';
}
function fld(label, inputHtml, hint) {
  return '<div class="mb-3"><label class="form-label">' + label + '</label>' + inputHtml + (hint ? '<div class="form-hint">' + hint + '</div>' : '') + '</div>';
}

document.addEventListener('click', function (e) {
  if (!e.target.closest('[data-dd-trigger]')) document.querySelectorAll('[data-dd-menu]').forEach(function (m) { m.classList.add('hidden'); });
});
function toggleFilterDD() {
  var menu = document.getElementById('filterDD'), hidden = menu.classList.contains('hidden');
  document.querySelectorAll('[data-dd-menu]').forEach(function (m) { m.classList.add('hidden'); });
  if (hidden) menu.classList.remove('hidden');
}

function statusBadge(status) {
  var map = { paid: 'badge-green', pending: 'badge-amber', bounced: 'badge-red', cleared: 'badge-blue' };
  var dot = { paid: 'badge-dot-green', pending: 'badge-dot-amber', bounced: 'badge-dot-red', cleared: 'badge-dot-blue' };
  var s = String(status || '').toLowerCase();
  return '<span class="badge ' + (map[s] || 'badge-gray') + '"><span class="badge-dot ' + (dot[s] || 'badge-dot-gray') + '"></span>' + E(s.charAt(0).toUpperCase() + s.slice(1)) + '</span>';
}
function modeBadge(mode) {
  var colors = { 'Bank Transfer': 'badge-blue', 'NEFT': 'badge-blue', 'RTGS': 'badge-blue', 'UPI': 'badge-purple', 'Cheque': 'badge-amber', 'Cash': 'badge-green' };
  return '<span class="badge ' + (colors[mode] || 'badge-gray') + '">' + E(mode) + '</span>';
}
function rowActionsHtml(editFn, delFn, viewFn, printFn) {
  return '<div class="flex gap-1">' +
    '<button onclick="' + viewFn + '" class="btn-icon-action" title="View">' + iconEye() + '</button>' +
    '<button onclick="' + printFn + '" class="btn-icon-action" title="Print">' + iconPrint() + '</button>' +
    '<button onclick="' + editFn + '" class="btn-icon-action" title="Edit">' + iconEdit() + '</button>' +
    '<button onclick="' + delFn + '" class="btn-icon-action danger" title="Delete">' + iconTrash() + '</button></div>';
}
function panelWrap(titleHtml, bodyHtml, extraHead) {
  return '<div class="bg-white border border-[#6da84c] rounded-xl shadow-sm overflow-hidden">' +
    '<div class="flex items-center justify-between gap-3 flex-wrap px-5 py-4 border-b border-gray-100"><div class="font-bold text-[14.5px] text-gray-800 flex items-center gap-2">' + titleHtml + '</div>' + (extraHead || '') + '</div>' +
    '<div>' + bodyHtml + '</div></div>';
}
function tableHtml(cols, rowsHtml) {
  var h = cols.map(function (c) { return '<th class="text-left text-[11px] font-bold uppercase tracking-wide text-gray-500 px-4 py-3 whitespace-nowrap">' + c + '</th>'; }).join('');
  return '<div class="overflow-auto h-[370px]"><table class="w-full text-[13px]"><thead class="sticky top-0"><tr class="bg-gray-200 border border-[#6da84c]">' + h + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
}

// =============================================================
// STATE
// =============================================================
var vendors = [], payments = [], loadState = 'loading', loadError = '';
var formBills = [], editingVpId = '';
var BANK_ACCOUNTS = ['HDFC Bank — Current', 'ICICI Bank — Current', 'Petty Cash'];
var PAY_MODES = ['Bank Transfer', 'NEFT', 'RTGS', 'UPI', 'Cheque', 'Cash'];

// =============================================================
// LOADING DATA
// =============================================================
async function loadVendors() {
  var list = await apiRequest('GET', VENDOR_API + '/vendor-list');
  vendors = (Array.isArray(list) ? list : []).map(function (v) { return { id: v.vendorStrId, name: v.vendorName, company: v.companyName }; });
  var sel = document.getElementById('filterVendor'), cur = sel.value || 'all';
  sel.innerHTML = '<option value="all">All Vendors</option>' + vendors.map(function (v) { return '<option value="' + E(v.id) + '">' + E(v.name) + '</option>'; }).join('');
  sel.value = cur; if (sel.value !== cur) sel.value = 'all';
}

var loadSeq = 0;
async function loadPayments() {
  var seq = ++loadSeq, q = [];
  var mode = document.getElementById('filterMode').value, vendor = document.getElementById('filterVendor').value;
  var searchEl = document.getElementById('searchInput'), search = searchEl ? searchEl.value.trim() : '';
  if (mode && mode !== 'all') q.push('mode=' + encodeURIComponent(mode));
  if (vendor && vendor !== 'all') q.push('vendorId=' + encodeURIComponent(vendor));
  if (search) q.push('search=' + encodeURIComponent(search));
  try {
    var data = await apiRequest('GET', VP_API + '/get-all-vendor-payments' + (q.length ? '?' + q.join('&') : ''));
    if (seq !== loadSeq) return;
    payments = (Array.isArray(data) ? data : []).map(function (p) { p.date = normDate(p.date); p.allocations = p.allocations || []; return p; });
    loadState = 'ready';
  } catch (err) {
    if (seq !== loadSeq) return;
    payments = []; loadState = 'error'; loadError = err.message;
  }
  renderPayments();
}

async function loadStats() {
  try {
    var s = await apiRequest('GET', VP_API + '/stats');
    document.getElementById('totalPayments').textContent = s.totalPayments;
    document.getElementById('totalPaid').textContent = money(s.totalPaid);
    document.getElementById('thisMonth').textContent = money(s.thisMonth);
    document.getElementById('pendingAmount').textContent = money(s.pendingAmount);
  } catch (err) { console.error('Stats failed', err); }
}
async function refreshAll() { await Promise.all([loadPayments(), loadStats()]); }

// =============================================================
// TABLE + PAGINATION
// =============================================================
var currentPayPage = 1, currentPayPageSize = 25;

function setPayPageSize(value) {
  var size = parseInt(value, 10);
  currentPayPageSize = [10, 25, 50, 100].indexOf(size) !== -1 ? size : 25;
  currentPayPage = 1; renderPayments();
}
function changePayPage(page) {
  var totalPages = Math.max(1, Math.ceil(payments.length / currentPayPageSize));
  currentPayPage = Math.min(Math.max(1, page), totalPages); renderPayments();
}
function payPaginationHtml(total) {
  var pages = Math.max(1, Math.ceil(total / currentPayPageSize));
  if (currentPayPage > pages) currentPayPage = pages;
  var start = total === 0 ? 0 : ((currentPayPage - 1) * currentPayPageSize) + 1, end = Math.min(currentPayPage * currentPayPageSize, total);
  var h = '<div class="flex items-center justify-between gap-3 flex-wrap px-5 py-3 border-t border-gray-200"><div class="text-[11px] text-gray-500">Showing ' + start + '–' + end + ' of ' + total + '</div><div class="flex items-center gap-1">';
  h += '<button type="button" onclick="changePayPage(' + (currentPayPage - 1) + ')" ' + (currentPayPage === 1 ? 'disabled' : '') + ' class="px-2.5 py-1 text-[11px] border rounded-lg ' + (currentPayPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '">Previous</button>';
  var from = Math.max(1, currentPayPage - 2), to = Math.min(pages, from + 4); from = Math.max(1, to - 4);
  for (var i = from; i <= to; i++) h += '<button type="button" onclick="changePayPage(' + i + ')" class="px-2.5 py-1 text-[11px] border rounded-lg ' + (i === currentPayPage ? 'bg-primary text-white border-primary' : 'text-gray-600 hover:bg-gray-50') + '">' + i + '</button>';
  h += '<button type="button" onclick="changePayPage(' + (currentPayPage + 1) + ')" ' + (currentPayPage === pages ? 'disabled' : '') + ' class="px-2.5 py-1 text-[11px] border rounded-lg ' + (currentPayPage === pages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-50') + '">Next</button></div></div>';
  return h;
}

function renderPayments() {
  var pages = Math.max(1, Math.ceil(payments.length / currentPayPageSize));
  if (currentPayPage > pages) currentPayPage = pages;
  var paged = payments.slice((currentPayPage - 1) * currentPayPageSize, currentPayPage * currentPayPageSize), rows = '';

  if (loadState === 'loading') {
    rows = '<tr><td colspan="8" class="text-center py-10 text-gray-400 text-sm">Loading vendor payments…</td></tr>';
  } else if (loadState === 'error') {
    rows = '<tr><td colspan="8" class="text-center py-10 text-red-500 text-sm">' + E(loadError) + '<br><button onclick="refreshAll()" class="mt-2 text-primary font-semibold hover:underline">Retry</button></td></tr>';
  } else if (payments.length === 0) {
    rows = '<tr><td colspan="8" class="text-center py-10 text-gray-400 text-sm"><div class="flex justify-center mb-2 empty-icon-svg">' + iconMoney() + '</div>No vendor payments found. Click "Record Payment" to add one.</td></tr>';
  } else {
    rows = paged.map(function (p) {
      var id = E(p.vpStrId);
      var bills = p.allocations.map(function (a) { return E(a.billNumber || a.billStrId); }).join(', ') || '—';
      return '<tr class="border-b border-gray-400 table-row-hover">' +
        '<td class="px-4 py-3"><div class="font-semibold text-gray-800">' + E(p.vpNumber) + '</div><div class="text-[11.5px] text-gray-400 font-mono">' + E(p.date) + '</div></td>' +
        '<td class="px-4 py-3 text-gray-600">' + E(p.vendorName) + '</td>' +
        '<td class="px-4 py-3 font-mono font-semibold text-primary">' + money(p.amount) + '</td>' +
        '<td class="px-4 py-3">' + modeBadge(p.mode) + '</td>' +
        '<td class="px-4 py-3 font-mono text-[12px] text-gray-500">' + (E(p.reference) || '—') + '</td>' +
        '<td class="px-4 py-3 text-[12px] text-gray-500">' + bills + '</td>' +
        '<td class="px-4 py-3">' + statusBadge(p.status) + '</td>' +
        '<td class="px-4 py-3">' + rowActionsHtml("editPayment('" + id + "')", "delPayment('" + id + "')", "viewReceipt('" + id + "')", "printReceipt('" + id + "')") + '</td></tr>';
    }).join('');
  }

  var sizeSel = '<div class="flex items-center gap-2"><span class="text-[11px] text-gray-400">Show:</span><select onchange="setPayPageSize(this.value)" class="text-[12px] border border-[#6da84c] rounded-lg px-2 py-1 bg-white outline-none">' +
    [10, 25, 50, 100].map(function (n) { return '<option value="' + n + '" ' + (currentPayPageSize === n ? 'selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>';

  document.getElementById('paymentsPanel').innerHTML = panelWrap(
    'All Vendor Payments <span class="text-[11px] font-bold bg-primary-soft text-primary-dark px-2 py-0.5 rounded-full ml-1">' + payments.length + '</span>',
    tableHtml(['Payment #', 'Vendor', 'Amount', 'Mode', 'Reference', 'Bills', 'Status', 'Actions'], rows) + payPaginationHtml(payments.length), sizeSel);
}

// =============================================================
// FILTERS
// =============================================================
var filterTimer = null;
function filterPayments() {
  currentPayPage = 1; updateFilterBadge();
  clearTimeout(filterTimer); filterTimer = setTimeout(loadPayments, 300);
}
function updateFilterBadge() {
  var n = 0;
  if (document.getElementById('filterMode').value !== 'all') n++;
  if (document.getElementById('filterVendor').value !== 'all') n++;
  var b = document.getElementById('filterBadge'); b.textContent = n; b.classList.toggle('hidden', n === 0);
}
function clearFilters() {
  document.getElementById('filterMode').value = 'all';
  document.getElementById('filterVendor').value = 'all';
  var s = document.getElementById('searchInput'); if (s) s.value = '';
  currentPayPage = 1; updateFilterBadge(); loadPayments(); toggleFilterDD();
}
function findPayment(id) { return payments.find(function (x) { return x.vpStrId === id; }); }

  var p = findPayment(id); if (!p) return;
  var alloc = p.allocations.map(function (a) {

  }).join('') || '<tr><td colspan="2" class="text-center py-3 text-gray-400 text-[12px]">No bill allocation.</td></tr>';

    '<div class="receipt-header"><div><div class="receipt-company-name">Kunash Media Pvt. Ltd.</div><div class="receipt-company-details">401, Creative Hub, BKC, Mumbai - 400051<br>GSTIN: 27AABCU1234D1ZP | Phone: +91-9876543210</div></div><div style="text-align:right;"><div class="receipt-title">PAYMENT RECEIPT</div></div></div>' +
    '<div class="receipt-meta"><div><div class="meta-label">Paid To</div><div class="meta-value">' + E(p.vendorName) + '</div></div><div style="text-align:right;">' +
    '<div><span class="meta-label">Payment #</span> <span class="meta-value">' + E(p.vpNumber) + '</span></div>' +
    '<div><span class="meta-label">Date</span> <span class="meta-value">' + E(p.date) + '</span></div>' +
    '<div><span class="meta-label">Mode</span> <span class="meta-value">' + E(p.mode) + '</span></div></div></div>' +
    '<table class="receipt-table"><thead><tr><th>Bill #</th><th style="text-align:right;">Amount Paid</th></tr></thead><tbody>' + alloc + '</tbody></table>' +
    '<div class="receipt-total">Total Paid: ' + money(p.amount) + '</div>' +
    '<div class="mt-3 grid grid-cols-2 gap-3 text-[13px]"><div><span class="text-gray-500">Reference:</span> <b>' + (E(p.reference) || '—') + '</b></div><div><span class="text-gray-500">Paid From:</span> <b>' + (E(p.bankAccountName) || '—') + '</b></div></div>' +
    (p.notes ? '<div class="mt-2 p-2 bg-gray-50 rounded text-[12px] text-gray-600"><b>Notes:</b> ' + E(p.notes) + '</div>' : '') +

function printReceipt(id) {
  if (!document.querySelector('.receipt-preview')) viewReceipt(id);
  setTimeout(function () { window.print(); }, 300);
}

// =============================================================
// ADD / EDIT PAYMENT
// =============================================================
function openAddPayment() { openPaymentModal(null); }
function editPayment(id) { var p = findPayment(id); if (p) openPaymentModal(p); }
function billLabel(b) { return (b.pbNumber || b.pbStrId) + ' (Bal: ' + money(b.balance) + ')'; }

function billOptionsHtml(selectedId, fallbackNumber) {
  var html = formBills.map(function (b) { return '<option value="' + E(b.pbStrId) + '" ' + (b.pbStrId === selectedId ? 'selected' : '') + '>' + E(billLabel(b)) + '</option>'; }).join('');
  if (selectedId && !formBills.some(function (b) { return b.pbStrId === selectedId; })) {
    html = '<option value="' + E(selectedId) + '" selected>' + E(fallbackNumber || selectedId) + '</option>' + html;
  }
  return html;
}
function allocRowHtml(billId, amount, fallbackNumber) {
  return '<tr class="border-b border-gray-100 line-item-row">' +
    '<td class="px-3 py-2"><select class="form-input bill-select" onchange="onBillChange(this)">' + billOptionsHtml(billId, fallbackNumber) + '</select></td>' +
    '<td class="px-3 py-2"><input type="number" class="form-input bill-amount" value="' + amount + '" step="0.01" min="0" oninput="calcAllocTotal()"></td>' +
    '<td class="px-3 py-2 text-center"><button type="button" onclick="removeAllocation(this)" class="btn-icon-action danger" title="Remove">' + iconX() + '</button></td></tr>';
}
var EMPTY_ALLOC_ROW = '<tr><td colspan="3" class="text-center py-4 text-gray-400 text-[12px]">No allocation. Click "Add Bill" to allocate this payment.</td></tr>';

function openPaymentModal(existing) {
  if (!vendors.length) { showToast('No vendors found. Add a vendor first.', 'warning'); return; }
  var e = existing || { vpStrId: '', vpNumber: '', date: todayStr(), vendorId: '', amount: '', mode: 'Bank Transfer', reference: '', bankAccountName: BANK_ACCOUNTS[0], allocations: [], notes: '', status: 'paid' };
  var isEdit = !!existing;
  formBills = []; editingVpId = isEdit ? e.vpStrId : '';

  var vendorOptions = '<option value="">— Select vendor —</option>' + vendors.map(function (v) { return '<option ' + (v.id === e.vendorId ? 'selected' : '') + ' value="' + E(v.id) + '">' + E(v.name) + '</option>'; }).join('');
  var modeOptions = PAY_MODES.map(function (m) { return '<option ' + (e.mode === m ? 'selected' : '') + '>' + E(m) + '</option>'; }).join('');
  var banks = BANK_ACCOUNTS.slice();
  if (e.bankAccountName && banks.indexOf(e.bankAccountName) === -1) banks.unshift(e.bankAccountName);
  var bankOptions = banks.map(function (b) { return '<option ' + (e.bankAccountName === b ? 'selected' : '') + '>' + E(b) + '</option>'; }).join('');
  var statusOptions = ['paid', 'pending', 'bounced'].map(function (s) { return '<option ' + (e.status === s ? 'selected' : '') + ' value="' + s + '">' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'; }).join('');
  if (e.status === 'cleared') statusOptions += '<option selected value="cleared">Cleared</option>';

  openModal(modalHeader(isEdit ? 'Edit Vendor Payment' : 'Record Vendor Payment', isEdit ? e.vpNumber : 'Record a new payment to vendor') +
    '<div class="px-6 py-4 modal-scroll">' +
    '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">' +
    fld('Payment #', '<input type="text" class="form-input" value="' + E(isEdit ? e.vpNumber : 'Auto-generated') + '" disabled>') +
    fld('Date *', '<input type="date" class="form-input" id="p_date" value="' + E(e.date) + '">') +
    fld('Vendor *', '<select class="form-input" id="p_vendor" onchange="onVendorChange()">' + vendorOptions + '</select>') +
    fld('Amount (₹) *', '<input type="number" class="form-input" id="p_amount" value="' + E(e.amount) + '" step="0.01" min="0" placeholder="0.00">') + '</div>' +
    '<div class="grid grid-cols-2 md:grid-cols-4 gap-3">' +
    fld('Mode *', '<select class="form-input" id="p_mode">' + modeOptions + '</select>') +
    fld('Reference', '<input type="text" class="form-input" id="p_reference" maxlength="100" value="' + E(e.reference) + '" placeholder="Txn/Cheque number">') +
    fld('Paid From', '<select class="form-input" id="p_bankAccount">' + bankOptions + '</select>') +
    fld('Status', '<select class="form-input" id="p_status">' + statusOptions + '</select>') + '</div>' +
    '<div class="mt-2 pt-3 border-t border-gray-100"><div class="flex items-center justify-between mb-2"><h4 class="text-[12.5px] font-semibold text-gray-800">Allocate to Bills</h4>' +
    '<button type="button" onclick="addAllocation()" class="text-[12px] font-semibold text-primary hover:underline flex items-center gap-1">' + iconPlus() + ' Add Bill</button></div>' +
    '<div class="border border-gray-200 rounded-xl overflow-hidden"><table class="w-full text-[13px]"><thead class="bg-gray-200"><tr>' +
    '<th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500">Bill</th>' +
    '<th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wide text-gray-500">Amount Paid</th>' +
    '<th class="px-3 py-2 text-center text-[11px] font-bold uppercase tracking-wide text-gray-500" style="width:60px;">Action</th></tr></thead>' +
    '<tbody id="allocBody">' + EMPTY_ALLOC_ROW + '</tbody></table></div>' +
    '<div class="mt-2 flex justify-between items-center text-[12px]"><span class="text-gray-500">Total Allocated: <b id="allocTotal" class="text-primary">₹0</b></span><span class="text-gray-500">Unallocated: <b id="unallocTotal" class="text-amber-600">₹0</b></span></div>' +
    '<div class="form-hint">Bill balances are reduced only when the status is Paid. Pending / Bounced payments do not change any bill.</div></div>' +
    '<div class="mt-3">' + fld('Notes', '<textarea rows="2" maxlength="1000" class="form-input" id="p_notes" placeholder="Additional notes">' + E(e.notes) + '</textarea>') + '</div></div>' +
    modalFooter(isEdit ? 'Update Payment' : 'Record Payment', 'onclick="savePayment(\'' + E(isEdit ? e.vpStrId : '') + '\', this)"'),
    { width: 'max-w-3xl' });

  document.getElementById('p_amount').addEventListener('input', calcAllocTotal);

  if (isEdit) {
    loadFormBills(e.vendorId, e.vpStrId).then(function () {
      var body = document.getElementById('allocBody'); if (!body) return;
      if (e.allocations.length) body.innerHTML = e.allocations.map(function (a) { return allocRowHtml(a.billStrId, a.amount, a.billNumber); }).join('');
      calcAllocTotal();
    });
  }
}

async function loadFormBills(vendorId, excludeVpStrId) {
  formBills = [];
  if (!vendorId) return;
  try {
    var url = VP_API + '/vendor-bills/' + encodeURIComponent(vendorId) + (excludeVpStrId ? '?excludeVpStrId=' + encodeURIComponent(excludeVpStrId) : '');
    var data = await apiRequest('GET', url);
    var cur = document.getElementById('p_vendor');
    if (cur && cur.value !== vendorId) return;
    formBills = Array.isArray(data) ? data : [];
  } catch (err) { formBills = []; showToast(err.message, 'error'); }
}

async function onVendorChange() {
  var vendorId = document.getElementById('p_vendor').value;
  document.getElementById('allocBody').innerHTML = EMPTY_ALLOC_ROW;
  calcAllocTotal();
  await loadFormBills(vendorId, editingVpId);
  if (vendorId && !formBills.length) showToast('This vendor has no bills with a pending balance.', 'info');
}

function allocatedExcept(row) {
  var total = 0;
  document.querySelectorAll('#allocBody .line-item-row').forEach(function (r) {
    if (r !== row) total += parseFloat(r.querySelector('.bill-amount').value) || 0;
  });
  return total;
}
function suggestAmount(billId, row) {
  var bill = formBills.find(function (b) { return b.pbStrId === billId; });
  if (!bill) return 0;
  var payAmt = parseFloat(document.getElementById('p_amount').value) || 0;
  var remaining = payAmt > 0 ? Math.max(payAmt - allocatedExcept(row), 0) : bill.balance;
  return round2(Math.min(bill.balance, remaining));
}
function addAllocation() {
  var vendorId = document.getElementById('p_vendor').value;
  if (!vendorId) { showToast('Select a vendor first', 'warning'); return; }
  if (!formBills.length) { showToast('This vendor has no bills with a pending balance.', 'info'); return; }
  var used = [];
  document.querySelectorAll('#allocBody .bill-select').forEach(function (s) { used.push(s.value); });
  var next = formBills.find(function (b) { return used.indexOf(b.pbStrId) === -1; });
  if (!next) { showToast('All open bills are already added.', 'info'); return; }
  var tbody = document.getElementById('allocBody');
  if (tbody.querySelector('tr td[colspan]')) tbody.innerHTML = '';
  tbody.insertAdjacentHTML('beforeend', allocRowHtml(next.pbStrId, suggestAmount(next.pbStrId, null)));
  calcAllocTotal();
}
function onBillChange(sel) {
  var row = sel.closest('tr');
  row.querySelector('.bill-amount').value = suggestAmount(sel.value, row);
  calcAllocTotal();
}
function removeAllocation(btn) {
  var row = btn.closest('tr'); if (row) row.remove();
  var tbody = document.getElementById('allocBody');
  if (tbody && !tbody.querySelector('.line-item-row')) tbody.innerHTML = EMPTY_ALLOC_ROW;
  calcAllocTotal();
}
function calcAllocTotal() {
  var total = 0;
  document.querySelectorAll('#allocBody .bill-amount').forEach(function (inp) { total += parseFloat(inp.value) || 0; });
  var a = document.getElementById('allocTotal'), u = document.getElementById('unallocTotal');
  if (a) a.textContent = money(round2(total));
  var amtEl = document.getElementById('p_amount'), payAmt = amtEl ? (parseFloat(amtEl.value) || 0) : 0;
  if (u) u.textContent = money(round2(Math.max(payAmt - total, 0)));
}

// =============================================================
// SAVE (create / update) — handled by the mock apiRequest
// =============================================================
async function savePayment(existingId, btn) {
  var date = document.getElementById('p_date').value, vendorId = document.getElementById('p_vendor').value;
  var amount = parseFloat(document.getElementById('p_amount').value) || 0;
  var mode = document.getElementById('p_mode').value, reference = document.getElementById('p_reference').value.trim();
  var bankAccount = document.getElementById('p_bankAccount').value, status = document.getElementById('p_status').value;
  var notes = document.getElementById('p_notes').value.trim();

  if (!date || !vendorId || amount <= 0) { showToast('Please fill required fields (Date, Vendor, Amount)', 'error'); return; }

  var allocations = [], seen = {}, allocTotal = 0, problem = '';
  document.querySelectorAll('#allocBody .line-item-row').forEach(function (row) {
    var billId = row.querySelector('.bill-select').value, amt = round2(parseFloat(row.querySelector('.bill-amount').value) || 0);
    if (!billId) return;
    if (amt <= 0) { problem = 'Every allocated bill needs an amount greater than 0.'; return; }
    if (seen[billId]) { problem = 'The same bill is allocated more than once.'; return; }
    seen[billId] = true;
    var bill = formBills.find(function (b) { return b.pbStrId === billId; });
    if (status === 'paid' && bill && amt > bill.balance + 0.005) { problem = 'Allocation for ' + (bill.pbNumber || billId) + ' exceeds its balance of ' + money(bill.balance) + '.'; return; }
    allocTotal += amt; allocations.push({ billStrId: billId, amount: amt });
  });
  if (!problem && round2(allocTotal) > round2(amount) + 0.005) problem = 'Total allocated (' + money(round2(allocTotal)) + ') exceeds the payment amount (' + money(amount) + ').';
  if (problem) { showToast(problem, 'error'); return; }

  var payload = { vendorId: vendorId, date: date, amount: round2(amount), mode: mode, reference: reference, bankAccountName: bankAccount, status: status, notes: notes, allocations: allocations };

  if (btn) btn.disabled = true;
  try {
    if (existingId) { await apiRequest('PUT', VP_API + '/update-vendor-payment/' + encodeURIComponent(existingId), payload); showToast('Payment updated successfully', 'success'); }
    else { await apiRequest('POST', VP_API + '/create-vendor-payment', payload); showToast('Payment recorded successfully', 'success'); }
    closeModal(); await refreshAll();
  } catch (err) { showToast(err.message, 'error'); if (btn) btn.disabled = false; }
}

// =============================================================
// DELETE
// =============================================================
function delPayment(id) {
  var p = findPayment(id); if (!p) return;
  openModal(modalHeader('Delete Vendor Payment', p.vpNumber) +
    '<div class="px-6 py-4 text-sm text-gray-600"><p>Are you sure you want to permanently delete <b class="text-gray-800">' + E(p.vpNumber) + '</b>?</p>' +
    '<p class="text-gray-400 text-[12px] mt-1">This action cannot be undone. Bill balances will be restored.</p>' +
    '<p class="text-amber-600 text-[12px] mt-2">Amount: ' + money(p.amount) + '</p></div>' +
    modalFooter('Delete', 'onclick="confirmDeletePayment(\'' + E(id) + '\', this)"', '', true), { width: 'max-w-md' });
}
async function confirmDeletePayment(id, btn) {
  if (btn) btn.disabled = true;
  try {
    await apiRequest('DELETE', VP_API + '/delete-vendor-payment/' + encodeURIComponent(id));
    closeModal(); showToast('Vendor payment deleted successfully', 'warning'); await refreshAll();
  } catch (err) { showToast(err.message, 'error'); if (btn) btn.disabled = false; }
}

// =============================================================
// SEARCH (injected in the top bar)
// =============================================================
(function addSearchToTopbar() {
  var header = document.querySelector('.app-main header');
  if (!header) return;
  var searchHtml = '<div class="hidden sm:flex flex-1 max-w-[420px] relative ml-4"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">' + iconSearch() + '</span>' +
    '<input type="text" id="searchInput" placeholder="Search payments by number, vendor, reference…" onkeyup="filterPayments()" class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg pl-9 pr-3 py-2 text-[13px] outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition placeholder:text-gray-400"></div>';
  var content = header.innerHTML, idx = content.indexOf('lg:hidden');
  if (idx !== -1) {
    var end = content.indexOf('</div>', idx) + 6;
    header.innerHTML = content.substring(0, end) + searchHtml + content.substring(end);
  }
})();

// =============================================================
// INIT
// =============================================================
(async function init() {
  renderPayments();
  try { await loadVendors(); } catch (err) { showToast('Could not load vendors: ' + err.message, 'error'); }
  await refreshAll();
})();
</script>
